<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Beast Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           PREMIUM GAMING BEAST UI V2 (ALL PARTS MERGED)
        ========================================== */
        
        html { scroll-behavior: smooth; }
        
        body {
            background:
            radial-gradient(circle at 20% 20%, rgba(124,58,237,.22), transparent 35%),
            radial-gradient(circle at 80% 30%, rgba(6,182,212,.18), transparent 35%),
            radial-gradient(circle at 50% 90%, rgba(236,72,153,.18), transparent 35%),
            linear-gradient(135deg, #030712, #050816, #091326, #04070d);
            background-size: 300% 300%;
            animation: auroraMove 18s ease infinite;
            position: relative;
            color: white;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
            linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 95%);
            pointer-events: none;
            z-index: -2;
            animation: gridMove 25s linear infinite;
        }
        
        body::after {
            content: "";
            position: fixed;
            inset: -40%;
            background:
            radial-gradient(circle, #7c3aed33 0%, transparent 25%),
            radial-gradient(circle, #06b6d433 0%, transparent 30%),
            radial-gradient(circle, #ec489933 0%, transparent 22%);
            background-size: 35% 35%;
            filter: blur(90px);
            animation: floatingGlow 18s linear infinite;
            pointer-events: none;
            z-index: -3;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #040816; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#7c3aed, #06b6d4); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(#8b5cf6, #22d3ee); }

        /* Better Glass */
        .glass-panel {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(22px);
            box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03) inset;
            transition: .35s;
        }
        
        .glass-card {
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(20px);
            overflow: hidden;
            position: relative;
            transition: .35s;
        }
        
        .glass-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
            transition: .8s;
        }
        
        .glass-card:hover::before { left: 160%; }
        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #7c3aed;
            box-shadow: 0 20px 50px rgba(124,58,237,.28), 0 0 30px rgba(6,182,212,.15);
        }

        /* Elements */
        button { transition: .28s; overflow: hidden; position: relative; }
        button:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(124,58,237,.35); }
        button:active { transform: scale(.96); }
        
        input, textarea { transition: .3s; }
        input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(124,58,237,.25); }
        img { transition: .4s; }
        img:hover { transform: scale(1.03); }

        /* Text Glow */
        .text-gradient {
            background: linear-gradient(90deg, #8b5cf6, #22d3ee, #ec4899);
            background-size: 250%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textMove 5s linear infinite;
        }
        
        .neon-text-purple { text-shadow: 0 0 12px #7c3aed, 0 0 35px #7c3aed; }

        /* Navbar Specific */
        nav { transition: .35s; }
        nav:hover { transform: translateX(-50%) translateY(-2px); }
        nav .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 15px 50px rgba(0,0,0,.4), 0 0 30px rgba(124,58,237,.12);
        }
        nav button::before {
            content: ""; position: absolute; left: -120%; top: 0; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
            transition: .7s;
        }
        nav button:hover::before { left: 160%; }
        nav button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 25px rgba(124,58,237,.35); }
        nav h1 { animation: logoGlow 3s infinite alternate; }

        /* Stat Cards */
        .statCard { position: relative; overflow: hidden; transition: .35s; animation: floatCard 6s ease-in-out infinite; }
        .statCard:nth-child(2) { animation-delay: 1s; }
        .statCard:nth-child(3) { animation-delay: 2s; }
        .statCard::before {
            content: ""; position: absolute; top: 0; left: -150%; width: 70%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
            transition: 1s;
        }
        .statCard:hover::before { left: 180%; }
        .statCard:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(124,58,237,.25);
        }
        .statLabel { font-size: 11px; letter-spacing: 3px; font-weight: 800; color: #94a3b8; }
        
        .xpContainer {
            height: 18px; border-radius: 999px; overflow: hidden; position: relative;
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
        }
        .xpFill {
            height: 100%; border-radius: 999px; background-size: 200%; position: relative;
            background: linear-gradient(90deg, #7c3aed, #06b6d4, #22c55e);
            animation: xpFlow 3s linear infinite;
        }
        .xpFill::after {
            content: ""; position: absolute; top: 0; left: -20%; width: 25%; height: 100%;
            background: rgba(255,255,255,.45); filter: blur(6px); animation: shine 2.5s infinite;
        }
        
        .coinIcon, .fireIcon { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 22px; font-size: 30px; }
        .coinIcon { background: linear-gradient(135deg, rgba(250,204,21,.25), rgba(234,179,8,.15)); color: #facc15; box-shadow: 0 0 25px rgba(250,204,21,.25); }
        .fireIcon { background: linear-gradient(135deg, rgba(239,68,68,.22), rgba(251,146,60,.15)); color: #fb923c; box-shadow: 0 0 25px rgba(251,146,60,.25); }

        /* Shop UI */
        .shopCard {
            background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
            border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(22px); transition: .35s; position: relative;
        }
        .shopCard:hover { transform: translateY(-12px) scale(1.03); border-color: #7c3aed; box-shadow: 0 25px 70px rgba(124,58,237,.25); }
        .shopCard::before {
            content: ""; position: absolute; left: -120%; top: 0; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transition: .8s;
        }
        .shopCard:hover::before { left: 170%; }
        .shopGlow {
            position: absolute; width: 220px; height: 220px; top: -80px; right: -80px;
            background: radial-gradient(#7c3aed55, transparent); filter: blur(50px); pointer-events: none;
        }
        .shopBadge { padding: 8px 16px; border-radius: 999px; background: linear-gradient(90deg, #7c3aed, #06b6d4); font-size: 10px; font-weight: 800; letter-spacing: 2px; }
        .shopPreview { margin-top: 18px; height: 140px; overflow: hidden; border-radius: 18px; border: 1px solid rgba(255,255,255,.08); }
        .shopPreview img { transition: .4s; }
        .shopCard:hover img { transform: scale(1.08); }
        .priceTag { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; color: #facc15; }
        .buyBtn {
            padding: 12px 22px; border-radius: 14px; font-weight: 800; color: black; transition: .3s;
            background: linear-gradient(90deg, #facc15, #fb923c);
        }
        .buyBtn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(250,204,21,.35); }

        /* Quests & Friends */
        .questCard {
            display: flex; justify-content: space-between; align-items: center; padding: 18px; margin-bottom: 16px; border-radius: 22px;
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); transition: .35s;
        }
        .questCard:hover { transform: translateY(-5px); border-color: #7c3aed; }
        .questIcon {
            width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #7c3aed, #06b6d4); font-size: 24px; color: white;
        }
        .claimBtn { padding: 12px 20px; border-radius: 14px; background: linear-gradient(90deg, #7c3aed, #06b6d4); font-weight: 800; color: white; }
        
        .friendCard {
            display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 14px; border-radius: 18px;
            background: rgba(255,255,255,.05); transition: .3s; border: 1px solid rgba(255,255,255,.08);
        }
        .friendCard:hover { transform: translateY(-4px); border-color: #06b6d4; }
        .friendAvatar { width: 52px; height: 52px; border-radius: 999px; object-fit: cover; }
        .friendOnline { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; background: #22c55e; border-radius: 999px; border: 2px solid #050816; }
        .chatBtn, .addFriendBtn { padding: 10px 18px; border-radius: 12px; background: linear-gradient(90deg, #06b6d4, #3b82f6); font-weight: 700; color: white; }

        /* Chat */
        .chatRow { display: flex; margin: 12px 0; }
        .chatRow.right { justify-content: flex-end; }
        .chatRow.left { justify-content: flex-start; }
        .chatBubble { padding: 14px 18px; border-radius: 18px; max-width: 75%; word-break: break-word; font-size: 14px; }
        .chatBubble.me { background: linear-gradient(90deg, #7c3aed, #06b6d4); color: white; }
        .chatBubble.other { background: rgba(255,255,255,.08); color: white; }
        .chatInput { width: 100%; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); color: white; }
        .sendBtn { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #7c3aed, #06b6d4); color: white; font-size: 18px; }

        /* Cursor & Micro Interactions */
        #cursorGlow {
            position: fixed; width: 220px; height: 220px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(124,58,237,.22), transparent 70%);
            filter: blur(20px); transform: translate(-50%, -50%); z-index: 9999;
            transition: transform .08s linear, opacity .25s; opacity: .9;
        }
        .reveal { opacity: 0; transform: translateY(40px); transition: all .8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .ripple {
            position: absolute; border-radius: 999px; background: rgba(255,255,255,.25);
            transform: scale(0); animation: ripple .7s linear; pointer-events: none;
        }
        .floatIcon { animation: floatingIcon 4s ease-in-out infinite; }
        .loader {
            border: none; width: 70px; height: 70px; border-radius: 50%; position: relative;
            background: conic-gradient(#7c3aed, #06b6d4, #ec4899, #7c3aed);
            animation: loaderRotate 1.2s linear infinite;
        }
        .loader::after { content: ""; position: absolute; inset: 8px; background: #050816; border-radius: 50%; }

        /* Keyframes */
        @keyframes auroraMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(60px); } }
        @keyframes floatingGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes textMove { 0% { background-position: 0%; } 100% { background-position: 200%; } }
        @keyframes logoGlow { from { filter: drop-shadow(0 0 10px rgba(124,58,237,.2)); } to { filter: drop-shadow(0 0 25px rgba(6,182,212,.45)); } }
        @keyframes shine { 100% { left: 120%; } }
        @keyframes xpFlow { 100% { background-position: 200%; } }
        @keyframes floatCard { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
        @keyframes ripple { to { transform: scale(5); opacity: 0; } }
        @keyframes floatingIcon { 50% { transform: translateY(-6px); } }
        @keyframes loaderRotate { 100% { transform: rotate(360deg); } }
    </style>
</head>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 mt-32 space-y-6 hidden" id="profileContent">
        
        <!-- [PLACEHOLDER: PART 3 - BANNER & PROFILE HERO WAS SKIPPED BY USER] -->

        <!-- Stats & XP Section (Part 4) -->
        <section class="grid lg:grid-cols-4 md:grid-cols-2 gap-6">
            <div class="glass-card statCard lg:col-span-2 p-7 rounded-[28px]">
                <div class="flex justify-between items-start flex-wrap gap-5">
                    <div>
                        <p class="statLabel">CURRENT LEVEL</p>
                        <h2 class="font-orbitron text-5xl font-black mt-2"><span id="uiLevel" class="text-gradient">1</span></h2>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-500 uppercase">Experience</p>
                        <p class="font-bold"><span id="uiXp">0</span> / <span id="uiXpMax">1000</span> XP</p>
                    </div>
                </div>
                <div class="xpContainer mt-8">
                    <div id="uiXpBar" class="xpFill" style="width:0%;"></div>
                </div>
                <div class="mt-4 flex justify-between text-xs text-gray-400">

            <div class="glass-card statCard p-7 rounded-[28px]">
                <div class="coinIcon floatIcon"><i class="fa-solid fa-coins"></i></div>
                <p class="statLabel mt-5">G-COINS</p>
                <h2 id="uiCoins" class="font-orbitron text-4xl font-black mt-2">0</h2>

            <div class="glass-card statCard p-7 rounded-[28px]">

        </section>

        <!-- G-Shop Snippet Example (Part 5) -->
        <section>
            <div class="shopCard rounded-3xl p-5 relative overflow-hidden">

                <div class="flex justify-between items-start">

                </div>
                <div class="mt-5">
                    <h3 class="font-orbitron text-xl font-black text-white">CYBER LEGEND</h3>
                    <p class="text-gray-400 text-sm mt-2">Exclusive profile title with premium gamer status.</p>
                </div>
                <div class="shopPreview">
                    <!-- Image Placeholder -->
                    <img src="https://via.placeholder.com/300" class="w-full h-full object-cover">
                </div>
                <div class="mt-8 flex items-center justify-between">
                    <div class="priceTag"><i class="fa-solid fa-coins"></i> 200</div>
                    <button onclick="buyItem('CYBER LEGEND','title',200)" class="buyBtn">BUY</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Quests, Chat, Friends Hub Modals placeholders can go here with the Part 6 classes attached -->

    <!-- Micro Interactions & Firebase Scripts (Part 7 & 8) -->
    <script type="module">
        // ===================================
        // CURSOR GLOW (Part 7)
        // ===================================
        const glow = document.getElementById("cursorGlow");
        document.addEventListener("mousemove", (e) => {
            glow.style.left = e.clientX + "px";
            glow.style.top = e.clientY + "px";
        });

        // ===================================
        // SCROLL REVEAL (Part 7)
        // ===================================
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting){
                    entry.target.classList.add("active");
                }
            });
        });
        document.querySelectorAll("section").forEach(sec => {
            sec.classList.add("reveal");
            observer.observe(sec);
        });

        // ===================================
        // BUTTON RIPPLE (Part 7)
        // ===================================
        document.querySelectorAll("button").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const ripple = document.createElement("span");
                ripple.className = "ripple";
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = size + "px";
                ripple.style.height = size + "px";
                ripple.style.left = (e.clientX - rect.left - size/2) + "px";
                ripple.style.top = (e.clientY - rect.top - size/2) + "px";
                btn.appendChild(ripple);
                setTimeout(() => { ripple.remove(); }, 700);
            });
        });

        // ===================================
        // FIREBASE LOGIC (Part 8 - User Original)
        // Note: Assumes variables db, currentUserUid, activeChatFriendUid, etc. are configured in outer scope
        // ===================================

    </script>
